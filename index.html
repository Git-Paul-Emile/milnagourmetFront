    <!-- ============================================================
         PROGRESSIVE WEB APP
         ============================================================
         Le lien vers le manifeste est injecté automatiquement par
         vite-plugin-pwa au build. Les balises ci-dessous complètent ce
         que le manifeste ne couvre pas.

         `theme_color` du manifeste ne s'applique qu'à l'app installée :
         cette balise colore aussi la barre d'adresse du navigateur lors
         d'une visite classique. -->
    <meta name="theme-color" content="#0D7F87" />

    <!-- iOS ignore complètement le manifeste : nom, icône et mode
         plein écran doivent lui être fournis par ces balises
         propriétaires, sans quoi l'ajout à l'écran d'accueil produit un
         raccourci générique ouvrant Safari avec sa barre d'adresse. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Milna" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="mobile-web-app-capable" content="yes" />
